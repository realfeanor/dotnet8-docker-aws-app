services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "TestPassw0rd@321"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost
        -U sa
        -P "TestPassw0rd@321"
        -C
        -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    container_name: dotnetapi
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: "Server=sqlserver;Database=Dotnet8DB;User=sa;Password=TestPassw0rd@321;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      sql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: reactapp
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlvolume:
