services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "xxx"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost
        -U xxx
        -P "xxx"
        -C
        -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    container_name: dotnetapi
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: "Server=dotnet8-db.xxx.eu-north-1.rds.amazonaws.com,1433;Database=Dotnet8DB;User Id=xxx;Password=xxx;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      sql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reactapp
    environment:
      REACT_APP_API_URL: http://api:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlvolume:
